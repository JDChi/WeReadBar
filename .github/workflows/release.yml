name: Release DMG

# Trigger only on tag pushes matching `v*` (e.g., v0.1.0).
# Regular commits to main do NOT trigger this — releases are explicit.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  release:
    name: Build DMG and publish Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build DMG
        env:
          # github.ref_name looks like 'v0.1.0' for tags; strip the leading 'v'
          # so the bundle's MARKETING_VERSION is '0.1.0' (CFBundleVersion
          # spec forbids the 'v' prefix).
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-dmg.sh "${VERSION#v}"

      - name: Prepare direct-download asset
        # Keep the versioned DMG produced by the build for traceability, but
        # upload a stable filename so the website can always use one URL.
        run: cp "dist/WeReadBar-${GITHUB_REF_NAME#v}.dmg" dist/WeReadBar.dmg

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir appcast
          cp dist/WeReadBar.dmg appcast/WeReadBar.dmg
          GENERATE_APPCAST="$(find build/SourcePackages/artifacts -type f -path '*/Sparkle/bin/generate_appcast' -print -quit)"
          test -n "${GENERATE_APPCAST}"
          printf '%s' "${SPARKLE_PRIVATE_KEY}" | "${GENERATE_APPCAST}" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/JDChi/WeReadBar/releases/download/${GITHUB_REF_NAME}/" \
            --full-release-notes-url "https://github.com/JDChi/WeReadBar/releases/tag/${GITHUB_REF_NAME}" \
            --link "https://github.com/JDChi/WeReadBar" \
            appcast
          cp appcast/appcast.xml dist/appcast.xml
          xmllint --noout dist/appcast.xml
          grep -q 'sparkle:edSignature=' dist/appcast.xml

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # This fixed filename makes /releases/latest/download/WeReadBar.dmg
          # a permanent direct-download URL for the latest stable release.
          files: |
            dist/WeReadBar.dmg
            dist/appcast.xml
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
          draft: false
