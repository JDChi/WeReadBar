name: WeReadBar
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.local.wereadbar
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: WeReadBar/Resources/Info.plist
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    # Declared localizations — keeps the Localizable.xcstrings content
    # visible in Xcode's localization editor and bakes into CFBundleLocalizations.
    knownRegions:
      - en
      - zh-Hans
      - zh-Hant

targets:
  WeReadBar:
    type: application
    platform: macOS
    sources:
      - path: WeReadBar
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        INFOPLIST_FILE: WeReadBar/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
